<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Wallet View</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>

    </style>
</head>
<body>
    <div class="content">
        <h2 th:text="'Welcome to your wallet: ' + ${wallet.name}"></h2>

        <div th:if="${#lists.isEmpty(assets)}">
            <p>You have no assets in your wallet. Please add some.</p>
        </div>

        <div th:unlless="${#lists.isEmpty(assets)}">
            <form action="#" th:action="@{/asset}" th:object="${wallet}">
                <button type="submit" class="btn btn-primary">Add asset</button>
            </form>
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">No</th>
                        <th scope="col">Ticker</th>
                        <th scope="col">Name</th>
                        <th scope="col">Asset Class</th>
                        <th scope="col">quantity</th>
                        <th scope="col">buy price</th>
                        <th scope="col">buy date</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="asset : ${assets}">
                        <th th:text="${assetStat.index} + 1" scope="row"></th>
                        <td th:text="${asset.ticker}"></td>
                        <td th:text="${asset.name}"></td>
                        <td th:text="${asset.assetClass}"></td>
                        <td th:text="${asset.quantity}"></td>
                        <td th:text="${asset.buyPrice}"></td>
                        <td th:text="${asset.buyDate}"></td>
                        <td>
                            <a th:href="@{/asset/edit/{id}(id=${asset.id})}"
                               style="background-color: white; color: black; border: 2px solid #008CBA; padding: 6px 8px; text-align: center; text-decoration: none; display: inline-block; font-size: 16px; margin: 4px 2px; transition-duration: 0.4s; cursor: pointer;">
                                Edit Asset
                            </a>
                            <a th:href="@{/asset/{id}(id=${asset.id})}"
                               style="background-color: white; color: black; border: 2px solid #f44336; padding: 6px 8px; text-align: center; text-decoration: none; display: inline-block; font-size: 16px; margin: 4px 2px; transition-duration: 0.4s; cursor: pointer;">
                                Remove Asset
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p>
            <a href="/"> Go back to main page</a>
        </p>

    </div>
</body>
</html>
