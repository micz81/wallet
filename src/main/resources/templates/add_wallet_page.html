<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Add Investment Wallet</title>
</head>
<body>

  <h1>Enter Wallet name and submit to save</h1>

  <form action="#" th:action="@{/wallet}" method="post" th:object="${wallet}">
    <p>
        Wallet name: <input type="text" th:field="*{name}" > <input type="submit" value="Submit">
    </p>

    <p>
        <a href="/"> Go back to main page</a>
    </p>
  </form>

</body>
</html>
