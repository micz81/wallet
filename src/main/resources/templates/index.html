<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Wallet App</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
          integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l"
          crossorigin="anonymous" />

    <style>
    h1 { color: black; font-family: 'Lato', sans-serif; font-size: 54px; font-weight: 300; line-height: 58px; margin: 0 0 58px; text-align: center; background-color: #ffcc66; margin: 25px 500px;}
    </style>

    <h1>Welcome to investment wallet tracking</h1>
</head>
<body>

    <div th:if="${wallets.empty}">
        <h2>You don't have any existing investment wallets. Please create a new one.</h2>
    </div>

    <div th:unless="${wallets.empty}">
        <h2>Your Wallets:</h2>
        <table class="table">
            <thead>
            <tr>
<!--                <th scope="col">No</th>-->
                <th scope="col">Wallet Name</th>
                <th scope="col">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="wallet : ${wallets}">
<!--                <th th:text="${walletStat.index} + 1" scope="row"></th>-->
                <td th:text="${wallet.name}"></td>
                <td>
                    <a th:href="@{/wallet/{id}(id=${wallet.id})}" th:object="${wallet}" class="access-wallet-button">Access Wallet</a>

                    <a th:href="@{/edit/{id}(id=${wallet.id})}" class="update-wallet-button">Edit Name</a>

                    <a th:href="@{/delete/{id}(id=${wallet.id})}" class="delete-wallet-button">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p>
        <a style="margin-left: 50px; border-style: ridge; padding: 6px 12px; background-color:MediumSeaGreen; color:black; font-weight: bold;" href="/wallet">
            Add new wallet
        </a>
    </p>

</body>
</html>
