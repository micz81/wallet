<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Deleting wallet</title>
</head>
<body>

    <h1>Wallet removal confirmation</h1>

    <form action="#" th:action="@{/wallet/delete/{id}(id=*{id})}" th:object="${wallet}">

        <h2 th:text="'Are you sure you want to delete investment wallet: ' + *{name}"></h2>

        <input type="submit" value="Delete wallet">
        <p>
            <a href="/"> Go back to main page</a>
        </p>
    </form>
</body>
</html>
